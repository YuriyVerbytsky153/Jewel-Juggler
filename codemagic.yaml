workflows:
  app-store-release:
    name: Jewel Juggler App Store upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: jeweljuggler
    environment:
      xcode: 27.1
      vars:
        APP_STORE_APPLE_ID: "6830754813"
    scripts:
      - name: Fetch App Store signing files from the portal
        script: |
          keychain initialize
          # Pull the current App Store profile for this bundle id straight from the portal
          # (only jeweljuggler_push, with Push, exists there) and the distribution cert.
          app-store-connect fetch-signing-files "com.jeweljuggler.circus" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed release
        script: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          xcode-project build-ipa --project "JewelJuggler.xcodeproj" --scheme "JewelJuggler" --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER COMPILER_INDEX_STORE_ENABLE=NO"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
