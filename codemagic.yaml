workflows:
  app-store-release:
    name: Jewel Juggler App Store upload
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: jeweljuggler
    environment:
      xcode: 27.1
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jeweljuggler.circus
      vars:
        APP_STORE_APPLE_ID: "6830754813"
    scripts:
      - name: Configure existing signing profiles
        script: xcode-project use-profiles
      - name: Build signed release
        script: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          agvtool new-version -all "$BUILD_NUMBER"
          xcode-project build-ipa --project "JewelJuggler.xcodeproj" --scheme "JewelJuggler" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/archive/*.xcarchive/dSYMs/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
